[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/muratmirgun/redcrab"

[workspace.dependencies]
redcrab-core = { path = "crates/redcrab-core" }
anyhow = "1"
thiserror = "2"
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "sync", "time"] }
futures = "0.3"
redis = { version = "1.8", default-features = false, features = ["tokio-comp", "aio", "connection-manager", "streams"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.dev.package."*"]
opt-level = 2
