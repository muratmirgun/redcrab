[package]
name = "redcrab-gui"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "redcrab"
path = "src/main.rs"

[features]
default = ["runtime-shaders"]
# Compile Metal shaders at startup instead of build time. Needed when only the
# Command Line Tools are installed (no `xcrun metal`). gpui-kit 0.8.1 turns
# this on in GPUI by itself, so turning the feature off changes nothing yet;
# once it no longer does, release builds made with full Xcode can turn it off
# to precompile the shaders.
runtime-shaders = ["dep:gpui-pre-apple", "gpui-pre-apple/runtime_shaders"]

[dependencies]
redcrab-core.workspace = true
gpui-kit = { version = "0.8.1", features = ["tree-sitter"] }
anyhow.workspace = true
futures.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
serde_json.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
gpui-pre-apple = { version = "=0.3.10", optional = true }

[dev-dependencies]
# Renders the app icon sizes for assets/logo/build-icns.sh.
resvg = { version = "0.46", default-features = false }
