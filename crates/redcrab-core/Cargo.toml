[package]
name = "redcrab-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
anyhow.workspace = true
tokio = { workspace = true, features = ["net", "io-util"] }
futures.workspace = true
redis.workspace = true
serde.workspace = true
# Exact float parsing: MessagePack edited as JSON must write back the very
# number it showed.
serde_json = { workspace = true, features = ["float_roundtrip"] }
tracing.workspace = true
hashbrown = "0.16"
foldhash = "0.2"
dirs = "6"
keyring-core = "1"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
# SSH tunnels. `ring` like rustls, so there is one crypto backend to build.
# `rsa` is for bastions and keys that are RSA only; it brings in the `rsa`
# crate, whose private-key operations are not constant-time
# (RUSTSEC-2023-0071, no fixed release): accepted in deny.toml and
# .cargo/audit.toml, and the README recommends Ed25519 keys.
russh = { version = "0.65", default-features = false, features = ["ring", "rsa", "flate2"] }
# Hashed known_hosts entries: base64 salts and HMAC-SHA1.
data-encoding = "2"
ring = "0.17"
# Value formats (formats.rs). Both are in the dependency tree already.
base64 = "0.22"
flate2 = "1"

[dev-dependencies]
proptest = { version = "1", default-features = false, features = ["std"] }
tokio = { workspace = true, features = ["net", "io-util", "rt-multi-thread"] }
# A TLS server of the tests' own (the one redis-rs already uses).
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1", features = ["keychain"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store = "1"

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
zbus-secret-service-keyring-store = { version = "1", features = ["rt-tokio-crypto-rust"] }
