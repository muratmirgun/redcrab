# Builds the packages for every platform with scripts/package/*.sh and, for a
# version tag, attaches them to a draft GitHub release to review and publish.
#
#   git tag v0.1.0 && git push origin v0.1.0     # tag must match Cargo.toml
#
# Pushes to main that touch the packaging run the same builds without
# publishing, so a broken package shows up before the next release.
#
# macOS signing is optional and switches on with repository secrets (see
# RELEASING.md); without them the app is ad-hoc signed. The update signature
# is not optional: a tag fails to publish without UPDATE_SIGNING_KEY.
name: Release

on:
  push:
    tags: ["v*"]
    branches: [main]
    paths:
      - scripts/package/**
      - .github/workflows/release.yml
      - assets/logo/**
      - crates/redcrab-gui/build.rs
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

defaults:
  run:
    shell: bash

env:
  RUST_TOOLCHAIN: "1.99"
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  macos:
    name: macOS (universal)
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_NOTARY_KEY_P8: ${{ secrets.APPLE_NOTARY_KEY }}
      APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
      APPLE_NOTARY_ISSUER: ${{ secrets.APPLE_NOTARY_ISSUER }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: aarch64-apple-darwin, x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          key: release

      # A throwaway keychain holding the Developer ID certificate, only when
      # the secrets exist. The identity it finds is what the script signs with.
      - name: Import the signing certificate
        if: env.APPLE_CERTIFICATE != ''
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password=$(openssl rand -hex 24)
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          base64 --decode <<<"$APPLE_CERTIFICATE" >"$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" \
            -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" >/dev/null
          # Keeps the existing keychains searchable; their paths have no spaces.
          # shellcheck disable=SC2046
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          identity=$(security find-identity -v -p codesigning "$keychain" |
            sed -n 's/.*"\(Developer ID Application: .*\)"/\1/p' | head -n 1)
          [ -n "$identity" ] || { echo "no Developer ID Application identity in the certificate" >&2; exit 1; }
          echo "APPLE_SIGNING_IDENTITY=$identity" >>"$GITHUB_ENV"

      - name: Write the notary key
        if: env.APPLE_NOTARY_KEY_P8 != ''
        run: |
          printf '%s' "$APPLE_NOTARY_KEY_P8" >"$RUNNER_TEMP/notary.p8"
          echo "APPLE_NOTARY_KEY=$RUNNER_TEMP/notary.p8" >>"$GITHUB_ENV"

      - name: Package
        env:
          TARGETS: aarch64-apple-darwin x86_64-apple-darwin
        run: scripts/package/macos.sh

      - uses: actions/upload-artifact@v7
        with:
          name: macos
          path: dist/*
          if-no-files-found: error

  linux:
    name: Linux (${{ matrix.arch }})
    # 22.04 on purpose: the binary needs at least the glibc it was built
    # against (2.35), which covers Ubuntu 22.04+, Debian 12+ and the like.
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, runner: ubuntu-22.04 }
          - { arch: aarch64, runner: ubuntu-22.04-arm }
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      # GPUI's build dependencies (see ci.yml) plus dpkg-dev for
      # dpkg-shlibdeps and desktop-file-utils to validate the .desktop file.
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libfontconfig-dev libfreetype-dev dpkg-dev desktop-file-utils

      - uses: Swatinem/rust-cache@v2
        with:
          key: release

      - name: Package
        run: scripts/package/linux.sh

      # Each .deb must install with its declared dependencies and run: the
      # terminal app's alone, then the desktop app's, which takes its place.
      - name: Install the .debs
        run: |
          sudo apt-get install -y ./dist/redcrab-tui_*.deb
          redcrab-tui --version
          sudo apt-get install -y ./dist/redcrab_*.deb
          redcrab --version
          redcrab-tui --version
          # A removed package says "not-installed": compare the whole status.
          if [ "$(dpkg-query -W -f '${Status}' redcrab-tui 2>/dev/null)" = "install ok installed" ]; then
            echo "::error::the desktop .deb did not take redcrab-tui's place"
            exit 1
          fi

      # The terminal app alone is for servers: no GUI library may be needed.
      - name: Check the terminal app's tarball
        run: |
          tar -xzf dist/redcrab-tui-*-linux-*.tar.gz -C "$RUNNER_TEMP"
          tui=$(echo "$RUNNER_TEMP"/redcrab-tui-*/redcrab-tui)
          "$tui" --version
          if ldd "$tui" | grep -E 'xcb|xkbcommon|wayland|vulkan|fontconfig|freetype|libX'; then
            echo "::error::redcrab-tui links against GUI libraries"
            exit 1
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: linux-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  windows:
    name: Windows (x86_64)
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: release

      - name: Package
        run: scripts/package/windows.sh

      # The zip must hold the executable with its resources compiled in: the
      # version block below comes from the same resource script as the icon.
      # The terminal app's own zip holds it alone.
      - name: Check the packages
        shell: pwsh
        run: |
          $zip = Get-ChildItem dist/redcrab-[0-9]*.zip | Select-Object -First 1
          if (-not $zip) { throw "the redcrab zip is missing" }
          Expand-Archive $zip.FullName -DestinationPath "$env:RUNNER_TEMP/check"
          $exe = Get-ChildItem "$env:RUNNER_TEMP/check" -Recurse -Filter redcrab.exe | Select-Object -First 1
          if (-not $exe) { throw "redcrab.exe is missing from $($zip.Name)" }
          if (-not (Test-Path (Join-Path $exe.DirectoryName "redcrab-tui.exe"))) {
            throw "redcrab-tui.exe is missing from $($zip.Name)"
          }
          $info = $exe.VersionInfo
          "$($info.ProductName) $($info.ProductVersion): $($info.FileDescription)"
          if ($info.ProductName -ne "redcrab") { throw "version resource missing" }

          $tuiZip = Get-ChildItem dist/redcrab-tui-*.zip | Select-Object -First 1
          if (-not $tuiZip) { throw "the redcrab-tui zip is missing" }
          Expand-Archive $tuiZip.FullName -DestinationPath "$env:RUNNER_TEMP/check-tui"
          $tui = Get-ChildItem "$env:RUNNER_TEMP/check-tui" -Recurse -Filter redcrab-tui.exe | Select-Object -First 1
          if (-not $tui) { throw "redcrab-tui.exe is missing from $($tuiZip.Name)" }
          if (Get-ChildItem "$env:RUNNER_TEMP/check-tui" -Recurse -Filter redcrab.exe) {
            throw "$($tuiZip.Name) holds the desktop app too"
          }
          & $tui.FullName --version
          if ($LASTEXITCODE -ne 0) { throw "redcrab-tui.exe did not start" }

      - uses: actions/upload-artifact@v7
        with:
          name: windows-x86_64
          path: dist/*
          if-no-files-found: error

  publish:
    name: Draft the GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, linux, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Check the tag against Cargo.toml
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match version $version in Cargo.toml"
            exit 1
          fi

      - name: Checksums
        working-directory: dist
        run: |
          cat ./*.sha256 >SHA256SUMS
          rm ./*.sha256
          sha256sum -c SHA256SUMS

      # Installed copies update only to a release whose SHA256SUMS carries
      # this signature (redcrab_core::update), checked against the public
      # key built into them, which this step checks it against too.
      - name: Sign the checksums
        working-directory: dist
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          if [ -z "$UPDATE_SIGNING_KEY" ]; then
            echo "::error::The UPDATE_SIGNING_KEY secret is missing; installed copies could not update to this release (see RELEASING.md)."
            exit 1
          fi
          key="$RUNNER_TEMP/update-signing-key.pem"
          (umask 077 && printf '%s\n' "$UPDATE_SIGNING_KEY" >"$key")
          openssl pkeyutl -sign -rawin -inkey "$key" -in SHA256SUMS -out SHA256SUMS.sig
          rm "$key"
          openssl pkeyutl -verify -rawin -pubin \
            -inkey ../crates/redcrab-core/src/update/release-key.pub.pem \
            -in SHA256SUMS -sigfile SHA256SUMS.sig

      # A draft, so the notes and files can be checked before publishing.
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --draft --verify-tag --generate-notes \
            --title "redcrab ${GITHUB_REF_NAME#v}"
